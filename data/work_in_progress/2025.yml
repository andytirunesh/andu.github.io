works:
  - title: "Smallholder Safety Nets and Market Integration"
    note: "Work in Progress"
    abstract: >
      Tests whether India’s Public Distribution System relaxes subsistence and risk constraints that otherwise limit smallholders’ ability to specialize after road upgrades.
  - title: "Broadband Backbones and Internal Migration in Africa"
    note: "Work in Progress"
    abstract: >
      Studies how inland fiber backbone expansions change the geography of opportunity, focusing on migration flows and firm formation.
  - title: "Roads, Cooperatives, and Factor Market Frictions"
    note: "Work in Progress"
    abstract: >
      Evaluates complementarities between feeder roads and producer cooperatives in alleviating input, credit, and aggregation frictions.
